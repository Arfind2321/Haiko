server {
    listen 80;
    
    large_client_header_buffers 4 100k;
    client_max_body_size 10M;

    location / {
        root /www;
        try_files $uri $uri/ /index.html =404;
    }

    location ^~ /api/central/ {

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS,, DELETE' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'application/json; charset=utf-8';
            return 204;
        }

        proxy_pass http://central:8080/;

        proxy_set_header X-Real-IP  $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Port  $server_port;
     }

     location /static/ {
       root /static;
     } 

     location /api/searcher/search {

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS,, DELETE' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'application/json; charset=utf-8';
            return 204;
        }

        proxy_pass http://http_api:8080/;

        proxy_set_header X-Real-IP  $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Port  $server_port;
     }

     location /api/pdf/gen {

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS,, DELETE' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'application/json; charset=utf-8';
            return 204;
        }

        proxy_pass http://pdf-generator:8000/api/pdf/gen;

        proxy_set_header X-Real-IP  $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Port  $server_port;
     }

     location /signin-yandex {

        proxy_pass http://central:8080/signin-yandex;

        proxy_set_header X-Real-IP  $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Port  $server_port;
     }
}